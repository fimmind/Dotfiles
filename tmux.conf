bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g history-limit 10000
set -g escape-time 0

setw -g mouse on

unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g default-terminal "tmux-256color"

set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "colour8"
set -g @tmux-dotbar-fg-current "colour7"
set -g @tmux-dotbar-fg-session "green"
set -g @tmux-dotbar-fg-prefix "cyan"
set -g @tmux-dotbar-bold-current-window true
set -g @tmux-dotbar-ssh-icon '󰌘'
set -g @tmux-dotbar-ssh-icon-only false
set -g @tmux-dotbar-ssh-enabled true

# PLUGINS
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vaaleyard/tmux-dotbar'

run '~/.tmux/plugins/tpm/tpm'
